# Builds YaoYao with the Reminders year fix and runs a small year check on a GitHub Mac.
# Lives only on the ci/reminders-fix-check branch. Nothing here is part of the app.
name: Reminders fix check

on:
  push:
    branches: [ci/reminders-fix-check]
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Use Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Year check (Thai calendar vs Gregorian)
        run: swift tools/ci/reminders-year-check.swift

      - name: Build the app (iOS Simulator, no signing)
        run: |
          if xcodebuild -project SuperJerry.xcodeproj -target SuperJerry -sdk iphonesimulator \
               -configuration Debug build CODE_SIGNING_ALLOWED=NO > app-build.log 2>&1; then
            echo "APP BUILD: SUCCEEDED"
          else
            echo "APP BUILD: FAILED"
            grep -E "error:" app-build.log | head -40
            exit 1
          fi
